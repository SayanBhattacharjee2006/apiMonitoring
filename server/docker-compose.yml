services:
  postgres:
    image: postgres:15-alpine
    container_name: api-monitoring-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-api_monitoring}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      # Bound to localhost (127.0.0.1) by default to prevent exposure on untrusted network interfaces
      - "${PG_HOST_BIND:-127.0.0.1}:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init-postgres.sql
    networks:
      - api-monitoring-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-api_monitoring}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:6.0
    container_name: api-monitoring-mongo
    ports:
      # Bound to localhost (127.0.0.1) by default to prevent exposure on untrusted network interfaces
      - "${MONGO_HOST_BIND:-127.0.0.1}:27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - api-monitoring-network
    restart: unless-stopped

  # RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: api-monitoring-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-api_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-secure_password}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-api_monitoring}
    ports:
      # Bound to localhost (127.0.0.1) by default to protect broker and management UI
      - "${RABBITMQ_HOST_BIND:-127.0.0.1}:5672:5672" # AMQP port
      - "${RABBITMQ_MGMT_HOST_BIND:-127.0.0.1}:15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - api-monitoring-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # pgAdmin (PostgreSQL web UI)
  pgadmin:
    image: dpage/pgadmin4:7
    container_name: api-monitoring-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin_secure_password}
    ports:
      # Bound to localhost (127.0.0.1) by default to prevent public web UI exposure
      - "${PGADMIN_HOST_BIND:-127.0.0.1}:8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - api-monitoring-network
    restart: unless-stopped
    depends_on:
      - postgres

  api-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-monitoring-app
    environment:
      NODE_ENV: production
      SERVICE_ROLE: api
      PORT: 5000
      # MongoDB (local container)
      MONGO_URI: mongodb://mongo:27017/${MONGO_DB_NAME:-api_monitoring}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-api_monitoring}
      # PostgreSQL (Docker container)
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: ${POSTGRES_DB:-api_monitoring}
      PG_USER: ${POSTGRES_USER:-postgres}
      PG_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # RabbitMQ (Docker container)
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-api_user}:${RABBITMQ_PASSWORD:-secure_password}@rabbitmq:5672/${RABBITMQ_VHOST:-api_monitoring}
      RABBITMQ_QUEUE: api_hits
      # Security (Validated strictly for API process role)
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SUPER_ADMIN_BOOTSTRAP_SECRET: ${SUPER_ADMIN_BOOTSTRAP_SECRET:?SUPER_ADMIN_BOOTSTRAP_SECRET is required}
      JWT_EXPIRES_IN: 24h
      # Rate Limiting
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX_REQUESTS: 100
    ports:
      - "5000:5000"
    volumes:
      - ./logs:/app/logs
    networks:
      - api-monitoring-network
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    container_name: api-monitoring-consumer
    environment:
      NODE_ENV: production
      SERVICE_ROLE: consumer
      # MongoDB (local container)
      MONGO_URI: mongodb://mongo:27017/${MONGO_DB_NAME:-api_monitoring}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-api_monitoring}
      # PostgreSQL (Docker container)
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: ${POSTGRES_DB:-api_monitoring}
      PG_USER: ${POSTGRES_USER:-postgres}
      PG_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # RabbitMQ (Docker container)
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-api_user}:${RABBITMQ_PASSWORD:-secure_password}@rabbitmq:5672/${RABBITMQ_VHOST:-api_monitoring}
      RABBITMQ_QUEUE: api_hits
    volumes:
      - ./logs:/app/logs
    networks:
      - api-monitoring-network
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local
  mongo_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  api-monitoring-network:
    driver: bridge
